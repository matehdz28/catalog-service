services:
  catalog-service:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:latest
    container_name: catalog-service
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
